<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-labelledby="simcdmlTitle simcdmlDesc">
<title id="simcdmlTitle">simcdm</title>
<desc id="simcdmlDesc">Hexagonal logo for the R package simcdm, drawn as a die seen corner-on: three faces meet at the centre, and their pips are a small simulated cognitive diagnostic data set. The left face is solid ink with the Q matrix cut out of it as square cells: a diagonal of three for the items that each need one skill, and a full column of three for the item that needs all of them. The right face is plain, with a faint dot grid and orange cells for four examinees' skill profiles. The top face is orange, with the simulated right answers cut out of it in a staircase that funnels toward the corner, two slips and two guesses away from what the profiles and Q predict. Pips on neighbouring faces line up across the edges they share. Below them the word simcdm wraps around the front corner: sim cut out of the ink face, cdm printed on the plain face.</desc>
